server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 字符集
    charset utf-8;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # SPA 路由：所有未命中静态文件的请求回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 静态资源带 hash 长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到后端服务（compose 内部服务名 backend）
    # 重点：SSE 长连接相关配置
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必备：禁用缓冲、保持长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 关闭 chunked 缓冲
        chunked_transfer_encoding on;
    }
}
